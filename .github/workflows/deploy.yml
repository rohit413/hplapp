name: HPL Auto Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Production
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            cd ${{ secrets.APP_DIR }}
            git pull origin main
            find . -type f -executable ! -path "*/node_modules/*" ! -path "*/.git/*" ! -path "*/.next/*" -delete
            npm ci
            npm run build
            pm2 restart hpladditives-nextjs
